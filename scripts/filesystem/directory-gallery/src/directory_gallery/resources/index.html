<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>$title_attribute</title>
  <link rel="stylesheet" href="assets/directory-gallery.css">
  <script src="assets/directory-gallery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-copy">
      <p class="eyebrow">Directory gallery</p>
      <h1>$title</h1>
      <p class="summary" id="catalog-summary">$summary</p>
    </div>
    <div class="controls" role="search">
      <label class="search-field">
        <span class="visually-hidden">Search creators and projects</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="catalog-search" type="search" placeholder="Search creators and projects" autocomplete="off">
      </label>
    </div>
    $alphabet
  </header>

  <main>
    <div id="creator-list">$creators</div>
    <p class="empty-state" id="no-results" hidden>No matching creators or projects.</p>
    $warnings
  </main>
</body>
</html>
